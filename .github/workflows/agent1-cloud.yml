# Agent-1 cloud runner (laptop can be closed)
#
# Fires every 30 minutes across the early competition day so all 5 submissions get used.
# The agent decides whether each trigger actually submits: run_cycle.py stops at the daily
# quota and refuses to submit within pacing.min_interval_minutes (30) of the last submission,
# so effective spacing lands in the 30-60 min band regardless of cron jitter or DST.
# GitHub cron is UTC. The 06:00-13:30 UTC window covers 01:00-08:30 CDT and 00:00-07:30 CST.
#
# Required repo secrets:
#   KAGGLE_USERNAME
#   KAGGLE_KEY
# Optional (email alerts):
#   AGENT1_SMTP_USER
#   AGENT1_SMTP_PASSWORD
#   AGENT1_NOTIFY_TO

name: agent1-cloud

on:
  schedule:
    # every 30 min, 06:00-13:30 UTC (01:00-08:30 CDT / 00:00-07:30 CST)
    - cron: "*/30 6-13 * * *"
    # hourly for the rest of the day so quota can still be recovered late
    - cron: "15 14-23 * * *"
    - cron: "15 0-5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore daily quota guard"
        type: boolean
        default: false
      skip_submit:
        description: "Research/analyze only (no Kaggle submit)"
        type: boolean
        default: false

concurrency:
  group: agent1-cloud
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "kaggle>=1.7,<2" pyyaml pandas numpy

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Missing KAGGLE_USERNAME / KAGGLE_KEY secrets" >&2
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > "$HOME/.kaggle/kaggle.json"
          chmod 600 "$HOME/.kaggle/kaggle.json"
          # KGAT_* secrets are Kaggle access tokens (kaggle>=2.2); legacy hex keys stay in kaggle.json only.
          case "$KAGGLE_KEY" in
            KGAT_*)
              printf '%s\n' "$KAGGLE_KEY" > "$HOME/.kaggle/access_token"
              chmod 600 "$HOME/.kaggle/access_token"
              ;;
          esac

      - name: Configure git for agent commits
        run: |
          git config user.name "ilakk manoharan"
          git config user.email "28582192+ilakkmanoharan@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Run one Agent-1 cycle
        env:
          AGENT1_NOTIFY_TO: ${{ secrets.AGENT1_NOTIFY_TO }}
          AGENT1_SMTP_USER: ${{ secrets.AGENT1_SMTP_USER }}
          AGENT1_SMTP_PASSWORD: ${{ secrets.AGENT1_SMTP_PASSWORD }}
          AGENT1_NOTIFY_FROM: ${{ secrets.AGENT1_SMTP_USER }}
          AGENT1_NOTIFY_ENABLED: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ -z "${AGENT1_NOTIFY_TO:-}" ]; then
            export AGENT1_NOTIFY_TO="ilakkmanoharan@gmail.com"
          fi
          ARGS=()
          if [ "${{ github.event.inputs.skip_submit || 'false' }}" = "true" ]; then
            ARGS+=(--skip-submit)
          fi
          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            ARGS+=(--force)
          fi
          python agent/run_cycle.py "${ARGS[@]}"
